routing_triggers: |
  - TECHNICAL CURTAILMENT / DISPATCH / CONSTRAINT: When a question asks about curtailment terms, revenue impact of a non-firm connection, dispatch modelling, or constraint analysis, energy_systems_eng is the lead technical specialist — not energy_project_finance. The revenue impact of curtailment is a power system engineering question (dispatch modelling, load flow, constraint probability) before it is a finance question. Add energy_project_finance only if the question explicitly asks about financing structure, debt capacity, or lender requirements.
  - energy_systems_eng TRIGGER: Select energy_systems_eng when the question involves load flow analysis, fault level assessment, protection coordination, power system stability, harmonic analysis, dispatch modelling, constraint quantification, or commissioning test failure. These are power system engineering questions. Do not substitute energy_project_finance or energy_grid_specialist for this role on technical questions.
  - CfD AUCTION MECHANICS: When a question involves CfD allocation round mechanics, administrative strike prices, auction design, AR clearing dynamics, underbid/overbid risk relative to the administrative price, or change-in-law provisions in CfD contracts, energy_regulatory must be selected alongside energy_renewables. The distinction: energy_renewables owns project-level bid economics (LCOE, revenue profile, what price to bid given project costs); energy_regulatory owns the auction framework (how the administrative strike price is set, AR competitive dynamics, what happens if AR is cancelled or reformed, CfD contract change-in-law). A CfD bid strategy question requires both. Do not assign this thread to energy_renewables alone.
  - energy_regulatory SCOPE: energy_regulatory covers energy market policy, CfD auction design and mechanics, DCO/consenting policy, licensing, Ofgem frameworks, and regulatory risk for lenders. It does NOT cover project-level route-to-market decisions where no policy or auction design question is raised, connection offer terms assessment (owned by energy_grid_specialist), or technical commissioning (owned by energy_systems_eng).
  - CONSENTING / PLANNING ROUTE: When a question involves the planning consent route, DCO process, section 36 consent (Scottish onshore wind above 50 MW), Scottish Ministers vs Secretary of State jurisdiction, pre-application statutory consultation, or consenting programme timeline, energy_regulatory must be selected. These are not energy_renewables questions — energy_renewables covers technology economics and yield, not planning law and consent procedure. On any consenting question where the consent route, jurisdiction, or programme timeline is in scope, energy_regulatory is the required specialist for that dimension. energy_environmental owns the environmental evidence, survey requirements, and HRA methodology; energy_regulatory owns the consent route, programme, and statutory process. Both are needed on consenting questions — they are not interchangeable and neither substitutes for the other.
  - energy_renewables / energy_environmental BOUNDARY: energy_renewables covers energy yield, technology selection, wake modelling, CfD economics, and BESS revenue modelling. It does NOT own HRA process, habitats survey methodology, IROPI, species-specific survey requirements, consent routes, or planning programme timelines. Do not add energy_renewables to a consenting or EIA question simply because the technology is wind or solar — the technology type is not a trigger for energy_renewables on planning questions.
  - QUALITY GATE — ADDITIVE COVERAGE ONLY: Before adding any specialist beyond the clear lead(s) for a sub-question, ask: what specific dimension does this specialist bring that the current panel cannot already cover? energy_renewables covers BESS ancillary service revenue modelling (Dynamic Containment, Moderation) — adding energy_regulatory for Capacity Market de-rating structure is duplicative unless the question explicitly asks about regulatory market design. energy_grid_specialist covers connection agreement obligations and DNO processes — adding energy_regulatory for G99 compliance framing is duplicative. Only add a specialist when their primary domain is directly and materially engaged and the lead specialist cannot substitute for it.
